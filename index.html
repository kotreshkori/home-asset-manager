<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home Asset Manager - v1</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f4f8;
      padding: 30px;
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      color: #2c3e50;
      text-align: center;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: bold;
      color: #34495e;
    }
    input, select, textarea {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
    button:hover {
      background-color: #2980b9;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 30px;
      background-color: white;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
      font-size: 14px;
    }
    th {
      background-color: #2c3e50;
      color: white;
    }
    .delete-btn {
  background-color: #e74c3c;
  width: auto;
  padding: 6px 12px;
  font-size: 13px;
}
.delete-btn:hover {
  background-color: #c0392b;
}
  </style>
</head>
<body>
  <h1>Home Asset Manager</h1>

  <form id="assetForm">
    <div class="form-group">
      <label for="name">Asset Name</label>
      <input type="text" id="name" required>
    </div>

    <div class="form-group">
      <label for="category">Category</label>
      <select id="category">
        <option value="Electronics">Electronics</option>
        <option value="Furniture">Furniture</option>
        <option value="Appliance">Appliance</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="form-group">
      <label for="room">Room/Location</label>
      <input type="text" id="room">
    </div>

    <div class="form-group">
      <label for="purchaseDate">Purchase Date</label>
      <input type="date" id="purchaseDate">
    </div>

    <div class="form-group">
      <label for="price">Purchase Price (₹)</label>
      <input type="number" id="price">
    </div>

    <div class="form-group">
      <label for="warrantyExpiry">Warranty Expiry Date</label>
      <input type="date" id="warrantyExpiry">
    </div>

    <div class="form-group">
      <label for="notes">Notes</label>
      <textarea id="notes" rows="2"></textarea>
    </div>

    <button type="submit">Add Asset</button>
  </form>

  <table>
    <thead>
<tr>
  <th>Name</th>
  <th>Category</th>
  <th>Room</th>
  <th>Purchase Date</th>
  <th>Price (₹)</th>
  <th>Warranty Expiry</th>
  <th>Notes</th>
  <th>Actions</th>
</tr>
    </thead>
    <tbody id="assetTableBody">
      <!-- Rows will be added here by JavaScript -->
    </tbody>
  </table>

  <script>
const form = document.getElementById("assetForm");
const tableBody = document.getElementById("assetTableBody");

let assets = JSON.parse(localStorage.getItem("assets")) || [];

function saveAssets() {
  localStorage.setItem("assets", JSON.stringify(assets));
}

function renderTable() {
  tableBody.innerHTML = "";

  assets.forEach(function(asset, index) {
    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${asset.name}</td>
      <td>${asset.category}</td>
      <td>${asset.room}</td>
      <td>${asset.purchaseDate}</td>
      <td>${asset.price}</td>
      <td>${asset.warrantyExpiry}</td>
      <td>${asset.notes}</td>
      <td><button class="delete-btn" onclick="deleteAsset(${index})">Delete</button></td>
    `;
    tableBody.appendChild(row);
  });
}

function deleteAsset(index) {
  assets.splice(index, 1);   // remove 1 item at position "index"
  saveAssets();
  renderTable();
}

function deleteAsset(index) {
  const asset = assets[index];
  const confirmed = confirm(`Are you sure you want to delete "${asset.name}"?`);

  if (confirmed) {
    assets.splice(index, 1);
    saveAssets();
    renderTable();
  }
}

form.addEventListener("submit", function(event) {
  event.preventDefault();

  const newAsset = {
    name: document.getElementById("name").value,
    category: document.getElementById("category").value,
    room: document.getElementById("room").value,
    purchaseDate: document.getElementById("purchaseDate").value,
    price: document.getElementById("price").value,
    warrantyExpiry: document.getElementById("warrantyExpiry").value,
    notes: document.getElementById("notes").value
  };

  assets.push(newAsset);
  saveAssets();
  renderTable();
  form.reset();
});

renderTable();
  </script>
</body>
</html>
