services:
  service-a:
    build: ./service-a
    container_name: service-a
    environment:
      - OTEL_COLLECTOR_ENDPOINT=http://otel-collector:4317
    ports:
      - "5001:5000"
    depends_on:
      - otel-collector
    networks:
      - monitoring

  service-b:
    build: ./service-b
    container_name: service-b
    environment:
      - SERVICE_A_URL=http://service-a:5000
      - LLM_SERVICE_URL=http://llm-service:5000
      - OTEL_COLLECTOR_ENDPOINT=http://otel-collector:4317
    ports:
      - "5002:5000"
    depends_on:
      - service-a
      - otel-collector
      - llm-service
    networks:
      - monitoring

  llm-service:
    build: ./llm-service
    container_name: llm-service
    environment:
      - OTEL_COLLECTOR_ENDPOINT=http://otel-collector:4317
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      - LLM_MOCK_MODE=${LLM_MOCK_MODE:-true}
    ports:
      - "5003:5000"
    depends_on:
      - otel-collector
    networks:
      - monitoring

  ai-analyst:
    build: ./ai-analyst
    container_name: ai-analyst
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
      - LOKI_URL=http://loki:3100
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      - ANALYST_INTERVAL_SECONDS=30
      - LLM_MOCK_MODE=${LLM_MOCK_MODE:-true}
    ports:
      - "5004:5000"
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - service-a
      - service-b
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki
    networks:
      - monitoring

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC — apps send traces/logs here
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - tempo
      - loki
    networks:
      - monitoring

  tempo:
    image: grafana/tempo:2.6.1
    container_name: tempo
    user: "0:0"
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/tmp/tempo
    ports:
      - "3200:3200"   # Tempo query API
    networks:
      - monitoring

  loki:
    image: grafana/loki:latest
    container_name: loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  tempo-data:
  loki-data:
